<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RBH isolated verification test</title><style>body{font:16px Arial,sans-serif;background:#152d54;color:#fff;max-width:420px;margin:4rem auto;padding:1rem}label{display:block;margin:1rem 0}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:6px}button{background:#d2b56e;color:#142748;border:0;cursor:pointer}button:disabled{opacity:.5}</style></head><body><h1>RBH isolated verification test</h1><p>Throwaway account only. This page will be removed after testing.</p><form id="login"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in to throwaway test account</button></form><button id="send" hidden disabled>Send verification test email</button><p id="status" role="status"></p><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script>
(function(){'use strict';
var UID='BrTzfPx6RidfEkGi41voomvUwxG2',EMAIL='bh4738255+rbhtest20260929@gmail.com';
var ENDPOINT='https://script.google.com/macros/s/AKfycbw1t19-Ivm8M7f6w2vJttJ_JmYRNYQCrTLHZBqVIrf6RpavadtNJsmR5EalMjC3_F-2ig/exec';
var config={apiKey:'AIzaSyBWl9NX064CJAZa03ltvVoF97X7_1BkGzs',authDomain:'raja-boot-house-dharni.firebaseapp.com',projectId:'raja-boot-house-dharni',appId:'1:983191567554:web:8feb614da884b5df29cf5b'};
var app=firebase.initializeApp(config,'rbh-isolated-test'),auth=app.auth(),login=document.getElementById('login'),send=document.getElementById('send'),status=document.getElementById('status');
function say(s){status.textContent=s}
function eligible(u){return !!u&&u.uid===UID&&u.email===EMAIL&&!u.emailVerified}
login.addEventListener('submit',function(e){e.preventDefault();var button=login.querySelector('button');button.disabled=true;say('Signing in...');auth.signInWithEmailAndPassword(document.getElementById('email').value,document.getElementById('password').value).then(function(x){document.getElementById('password').value='';if(!eligible(x.user)){auth.signOut();throw Error('This is not the unverified throwaway account')}login.hidden=true;send.hidden=false;send.disabled=false;say('Throwaway account ready. No email sent yet.')}).catch(function(e){say(e.message||'Sign-in failed')}).finally(function(){button.disabled=false})});
send.addEventListener('click',function(){var u=auth.currentUser;if(!eligible(u)){say('Throwaway test account not eligible');return}send.disabled=true;say('Submitting verification test request...');u.getIdToken().then(function(idToken){return fetch(ENDPOINT,{method:'POST',mode:'no-cors',body:JSON.stringify({idToken:idToken})})}).then(function(){say('Request submitted; check throwaway inbox for actual receipt. Submission is not proof of delivery.')}).catch(function(){say('Could not submit test request');send.disabled=false})});
})();
